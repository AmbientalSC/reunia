[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = "14.2"

# whisper.cpp/ggml: força baseline AVX2 em vez de detectar a CPU da máquina de build (no CI,
# AVX-512, que derruba o app em PCs sem essa extensão). Ver cmake/ggml-portable.cmake.
CMAKE_PROJECT_INCLUDE = { value = "cmake/ggml-portable.cmake", relative = true }
